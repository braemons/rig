# The two directories every braemons daemon shares (contracts/DAEMON_LAYOUT.md):
# rig configs in /etc/braemons, which a person and a package upgrade edit, and
# each daemon's documents under /var/lib/braemons/<daemon>, which only the
# daemon writes. Each daemon's own unit creates its subdirectory
# (StateDirectory=braemons/<daemon>); these are the parents, so that a box
# with no daemon installed yet already has the layout to copy configs into.
d /etc/braemons      0755 root root -
d /var/lib/braemons  0755 root root -
