# braemons Samba shares: the rig's settings and every daemon's documents.
#
# NOT ACTIVE ON ITS OWN. braemons-rig does not pull in Samba, so a packaged rig
# has no SMB server at all unless you install one. To export these shares,
# install samba and append this to the END of /etc/samba/smb.conf:
#
#     [global]
#        include = /usr/share/braemons/rig/braemons-shares.conf
#
# then check it parses, seed a Samba password for the admin account, and start
# the daemons:
#
#     testparm -s
#     smbpasswd -a <admin-user>
#     systemctl enable --now smbd nmbd
#
# Including rather than copying means a package upgrade that changes these
# stanzas reaches the rig. The Raspberry Pi image does all of this, including
# the pam_exec hook that keeps the Samba and Unix passwords in sync; see
# image/build-sd-image.sh in braemons/rig.

[global]
   # Connections Samba cannot authenticate fall back to the guest account
   # instead of being refused, which is what lets the read-only browsing below
   # work with no credentials at all.
   #
   # NB: server-wide, not per-share. Do not include this file on a
   # general-purpose file server where that is not what you want.
   map to guest = bad user

   # Changing the Samba password (smbpasswd, or from a Windows client) also
   # changes the Unix one. Closing the loop in the other direction — so a
   # normal passwd, or a forced first-login change, updates Samba too — needs a
   # pam_exec hook in the password stack, which the image installs. Debian has no
   # libpam-smbpass, which is what would otherwise do this.
   unix password sync = yes
   pam password change = yes
   passwd program = /usr/bin/passwd %u
   passwd chat = *password:* %n\n *password:* %n\n *successfully*

# Both shares are browsable read-only by anyone on the LAN, and writable only
# by an administrator. 'read only = yes' is the default for everyone including
# guests; 'write list' is the exception that grants admins write access.
#
# The write list is by group rather than a hard-coded account name, so this
# file needs no per-rig editing: @sudo covers Debian/Ubuntu/Raspberry Pi OS,
# @wheel covers Fedora/RHEL. Anyone in those groups can already write these
# paths over SSH, so granting the same over SMB concedes nothing new. A group
# that does not exist on this system is simply never matched.
#
# LAN-only trust assumption: guest browsing means anyone who can reach the box
# can read every rig config and every daemon's saved documents. Keep it off untrusted
# networks.

[braemons-config]
   path = /etc/braemons
   browseable = yes
   read only = yes
   guest ok = yes
   write list = @sudo @wheel
   create mask = 0644
   directory mask = 0755

[braemons-data]
   path = /var/lib/braemons
   browseable = yes
   read only = yes
   guest ok = yes
   write list = @sudo @wheel
   create mask = 0644
   directory mask = 0755
   # Each daemon's unit owns /var/lib/braemons/<daemon> through
   # StateDirectory=, and systemd (re)asserts that ownership on every start — without this,
   # writes from the write list would fail no matter what the masks say. Guest
   # connections never reach it: 'read only' blocks writes before force user
   # would apply.
   force user = root
