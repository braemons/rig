name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Install nfpm and shellcheck
        run: |
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v2.43.1/nfpm_2.43.1_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm
          sudo apt-get install -y -qq shellcheck
      - name: shellcheck
        run: shellcheck braemons-rig/braemons-set-hostname braemons-rig/*.sh scripts/git-version.sh image/build-sd-image.sh
      # Before the first tag there is no version to read; CI builds with a
      # placeholder so a package that does not build is caught before a release.
      - name: Build the three packages
        run: make packages RIG_VERSION=$(scripts/git-version.sh 2>/dev/null || echo 0.0.0~ci)
      - name: Install them on Debian bookworm, the base of Raspberry Pi OS
        run: |
          docker run --rm -v "$PWD/dist:/dist" debian:bookworm-slim sh -ec '
            apt-get update -qq
            apt-get install -y -qq /dist/braemons-tools_*.deb /dist/braemons-rig_*.deb
            for command in vstimctl statemachinectl mousewheelctl trialctl; do "$command" --version; done
            test -d /etc/braemons && test -d /var/lib/braemons
            test -f /usr/share/braemons/rig/braemons-shares.conf'
